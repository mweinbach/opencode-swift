name: CI & Cross-Platform Parity

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

jobs:
  swift-testing-matrix:
    name: Swift Testing (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Linux
            os: ubuntu-24.04
            container: swift:6.2
          - name: Windows
            os: windows-2022
            swift: true
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with Swift 6.2 on macOS
        if: matrix.os == 'macos-15'
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::No Xcode 26.x (Swift 6.2) found in /Applications"
            ls -la /Applications
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          swift --version
      - name: Install Swift 6.2 on Windows
        if: matrix.os == 'windows-2022'
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2.4-release
          swift-build: 6.2.4-RELEASE
      - name: Restore Windows SwiftPM build cache
        if: matrix.os == 'windows-2022'
        id: win-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            Packages/OpenTUI/.build
          key: windows-swift-6.2.4-build-${{ hashFiles('Package.swift', 'Packages/OpenTUI/Package.swift', 'Packages/OpenTunnel/Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift', 'Packages/OpenTUI/Sources/**/*.swift', 'Packages/OpenTUI/Tests/**/*.swift') }}
          restore-keys: |
            windows-swift-6.2.4-build-
      - name: Ensure modern sqlite3.dll on PATH (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "C:\hostedtoolcache\windows\Python\*\x64\DLLs\sqlite3.dll" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Filter "sqlite3.dll" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*\x64\DLLs\sqlite3.dll" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if ($dll) {
            Write-Host "Using SQLite DLL: $($dll.FullName)"
            $pyExe = Join-Path (Split-Path $dll.DirectoryName -Parent) "python.exe"
            if (Test-Path $pyExe) {
              & $pyExe -c "import sqlite3; print('SQLite version:', sqlite3.sqlite_version)"
            }
            $dll.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "No hostedtoolcache Python x64 sqlite3.dll found; relying on system sqlite3/winsqlite3"
          }
      - name: Verify Swift version
        run: swift --version
      - name: Test swift-opencode (Swift Testing)
        if: matrix.os != 'windows-2022'
        run: ./scripts/test.sh .
      - name: Build swift-opencode tests (Windows)
        if: matrix.os == 'windows-2022'
        id: build-win
        run: swift build --build-tests
      - name: Test swift-opencode (Swift Testing, Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          swift test --skip-build --disable-xctest --enable-swift-testing --no-parallel
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::swift test exited with code $code"
            $exe = ".build\debug\swift-opencodePackageTests.xctest"
            if (Test-Path $exe) {
              foreach ($probe in @("liveEmbeddedSDKWorkflow", "SQLite", "NativeFileWatcher", "WindowsNamedPipe", "OpenCodePlatformTests", "OpenCodeUtilTests")) {
                Write-Host "=== Direct .xctest probe: $probe ==="
                $proc = Start-Process -FilePath $exe -ArgumentList "--testing-library", "swift-testing", "--no-parallel", "--filter", $probe -NoNewWindow -Wait -PassThru
                Write-Host ("probe $probe exit code: {0} (0x{1:X8})" -f $proc.ExitCode, ($proc.ExitCode -band 0xFFFFFFFF))
              }
              Write-Host "=== Probing all non-OpenCodeApp tests ==="
              swift test --skip-build --disable-xctest --enable-swift-testing --no-parallel --skip "OpenCodeApp"
              Write-Host "non-OpenCodeApp exit code: $LASTEXITCODE"
            }
            exit $code
          }
      - name: Test Packages/OpenTUI (Swift Testing)
        if: matrix.os != 'windows-2022'
        run: ./scripts/test.sh Packages/OpenTUI
      - name: Test Packages/OpenTUI (Swift Testing, Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          swift test --package-path Packages/OpenTUI --disable-xctest --enable-swift-testing --no-parallel
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::OpenTUI swift test exited with code $code"
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
              Select-Object -First 5 |
              Format-List TimeCreated, ProviderName, Id, Message
            exit $code
          }
      - name: Build opencode CLI
        run: swift build --product opencode
      - name: Save Windows SwiftPM build cache
        if: always() && matrix.os == 'windows-2022' && steps.build-win.outcome == 'success' && steps.win-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            Packages/OpenTUI/.build
          key: ${{ steps.win-cache-restore.outputs.cache-primary-key }}

  upstream-parity-audit:
    name: Live Upstream Parity & Drift Check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with Swift 6.2 on macOS
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::No Xcode 26.x (Swift 6.2) found in /Applications"
            ls -la /Applications
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          swift --version
      - uses: oven-sh/setup-bun@v2
      - name: Sync pinned upstream commits
        run: ./scripts/parity.sh sync
      - name: Run full code-level & function-level parity harness
        run: ./scripts/parity.sh all
